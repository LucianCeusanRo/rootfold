[project]
name = "rootfold"
version = "0.3.0"
description = "Topology-aware NOC incident layer: fold alert storms into one root-cause incident, then sweep after recovery."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Lucian Ceusan" }]
keywords = ["noc", "incident", "correlation", "recovery-sweep", "network"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "pyjwt>=2.10.0",
  "python-multipart>=0.0.17",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "playwright>=1.65.0",
]

[project.scripts]
rootfold = "rootfold.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootfold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "ui: Playwright operator-console smoke tests (needs Chromium)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "playwright>=1.65.0",
]
