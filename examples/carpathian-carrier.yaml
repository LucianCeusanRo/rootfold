bundles:
  - slug: lacp-bcu-core
    name: BCU-POP LACP to core
    device: bcu-pop-rtr1
    members:
      - cir-core-east
      - cir-core-west

dependencies:
  # Core LACP: if the bundle is down, the metro PoP and everything behind it is a symptom.
  - parent: {type: bundle, slug: lacp-bcu-core}
    child: {type: site, slug: bcu-pop}
  - parent: {type: site, slug: bcu-pop}
    child: {type: site, slug: ons}
  - parent: {type: site, slug: bcu-pop}
    child: {type: site, slug: rmn}

  - parent: {type: circuit, slug: cir-bcu-ons}
    child: {type: site, slug: ons}
  - parent: {type: circuit, slug: cir-ons-adj}
    child: {type: site, slug: adj}
  - parent: {type: circuit, slug: cir-adj-fcs}
    child: {type: site, slug: fcs}
  - parent: {type: circuit, slug: cir-bcu-rmn}
    child: {type: site, slug: rmn}
  - parent: {type: circuit, slug: cir-rmn-pnt}
    child: {type: site, slug: pnt}

  # Microwave last mile — used by the recovery-sweep lab scenario.
  - parent: {type: circuit, slug: cir-ons-drm-mw}
    child: {type: site, slug: drm}
  - parent: {type: site, slug: drm}
    child: {type: site, slug: cms}
  - parent: {type: site, slug: drm}
    child: {type: circuit, slug: cir-drm-customer}
  - parent: {type: circuit, slug: cir-drm-cms-mw}
    child: {type: site, slug: cms}
  - parent: {type: circuit, slug: cir-ons-toc-mw}
    child: {type: site, slug: toc}
  - parent: {type: circuit, slug: cir-pnt-bcz-mw}
    child: {type: site, slug: bcz}

  # Downstream site chains for blast radius.
  - parent: {type: site, slug: ons}
    child: {type: site, slug: adj}
  - parent: {type: site, slug: ons}
    child: {type: site, slug: drm}
  - parent: {type: site, slug: ons}
    child: {type: site, slug: toc}
  - parent: {type: site, slug: adj}
    child: {type: site, slug: fcs}
  - parent: {type: site, slug: rmn}
    child: {type: site, slug: pnt}
  - parent: {type: site, slug: pnt}
    child: {type: site, slug: bcz}
